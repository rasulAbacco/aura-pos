name: CI
on: [push, pull_request]
jobs:
  test-and-build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_USER: aura, POSTGRES_PASSWORD: aura, POSTGRES_DB: aura_test }
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://aura:aura@localhost:5432/aura_test
      DATABASE_URL: postgresql://aura:aura@localhost:5432/aura_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            server/package-lock.json
            client/package-lock.json
      - name: Server — install, check schema, test
        working-directory: server
        run: |
          npm ci
          npx prisma generate
          # Fails if schema.prisma and the committed migrations disagree.
          # UNVERIFIED: could not be run in the build sandbox; Prisma may need a shadow DB URL in prisma.config.ts.
          npx prisma migrate diff --from-migrations prisma/migrations --to-schema prisma/schema.prisma --exit-code || (echo "Schema drift — create a migration" && exit 1)
          npm test
          npm audit --omit=dev --audit-level=high
      - name: Client — install, build
        working-directory: client
        run: |
          npm ci
          npm run build
          npm audit --omit=dev --audit-level=high
